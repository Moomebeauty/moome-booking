<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>沐蜜 Moome · 開放時段設定（管理用）</title>
<style>
  :root{
    --ink:#4a4038; --taupe:#8c7c6a; --taupe-deep:#6f6151;
    --cream:#f3ece2; --cream-soft:#faf5ec; --sand:#e6dccb;
    --line:#ddd0bd; --muted:#9b8d7c; --ok:#7c8a6a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--cream);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream)}
  header{padding:36px 26px 22px;text-align:center;background:linear-gradient(180deg,#efe6d8,var(--cream))}
  .moome{font-family:"Brush Script MT","Segoe Script",cursive;font-size:34px;line-height:1;margin-bottom:6px}
  .tag{font-size:13px;color:var(--taupe-deep);letter-spacing:.2em}
  .sub{font-size:12.5px;color:var(--muted);margin-top:8px}

  section{padding:24px 26px;border-top:1px solid var(--sand)}
  .svcmgr{background:#fff}
  .svclist{display:flex;flex-direction:column;gap:9px;margin-top:16px}
  .svcgrp{font-size:13px;font-weight:700;color:var(--taupe-deep);letter-spacing:.1em;
    margin:12px 2px 2px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .svcrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;
    border:1px solid var(--line);border-radius:12px;background:var(--cream-soft);cursor:pointer}
  .svcrow:active{background:#efe6d9}
  .svcrow .sr-l{flex:1;min-width:0}
  .svcrow .sr-n{font-size:14.5px;font-weight:600;color:var(--ink)}
  .svcrow .sr-m{font-size:12px;color:var(--muted);margin-top:2px}
  .svcrow .sr-p{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap}
  .sr-tag{display:inline-block;font-size:10px;color:#fff;background:var(--taupe);
    padding:1px 7px;border-radius:4px;margin-left:6px}
  .sr-add{font-size:10px;color:var(--taupe-deep);background:#ece1d0;padding:1px 7px;border-radius:4px;margin-left:6px}
  .svcmask{position:fixed;inset:0;z-index:60;background:rgba(74,64,56,.45);display:flex;
    align-items:center;justify-content:center;padding:16px}
  .svccard{background:#fff;border-radius:18px;width:100%;max-width:440px;max-height:90vh;
    display:flex;flex-direction:column;overflow:hidden}
  .svchead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
    border-bottom:1px solid var(--line);font-size:16px;font-weight:700;color:var(--ink)}
  .svcx{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted)}
  .svcbody{overflow-y:auto;padding:16px 18px}
  .svcfoot{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
  .navbtn2.del{flex:0 0 90px;border-color:#c08070;color:#b0563f;background:#fff;border-radius:26px;
    border-width:1px;border-style:solid;font:inherit;font-size:14px;cursor:pointer;font-weight:600}
  .fsec{font-size:13px;font-weight:700;color:var(--taupe-deep);letter-spacing:.08em;
    margin:20px 0 4px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .frow{display:flex;gap:12px}.frow>div{flex:1}
  .req{font-size:10px;color:#b0563f;background:#f7e8e2;padding:1px 6px;border-radius:4px;margin-left:5px}
  .svcbody input,.svcbody textarea,.svcbody select{width:100%;font:inherit;padding:12px 13px;
    border:1px solid var(--line);border-radius:11px;background:var(--cream-soft);color:var(--ink)}
  .svcbody textarea{resize:vertical;line-height:1.6}
  .bookings{background:#fff}
  .bkfilter{display:flex;gap:8px;margin:12px 0 16px;flex-wrap:wrap}
  .bkf{font:inherit;font-size:13px;padding:8px 15px;border:1px solid var(--line);border-radius:20px;
    background:var(--cream-soft);color:var(--muted);cursor:pointer;transition:.18s}
  .bkf.on{background:var(--taupe);border-color:var(--taupe);color:var(--cream-soft)}
  .bkf.reload{margin-left:auto;padding:8px 13px}
  .bklist{display:flex;flex-direction:column;gap:10px}
  .bkcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--cream-soft)}
  .bkcard.today{border-color:var(--taupe);background:#fff;box-shadow:0 2px 10px rgba(140,124,106,.1)}
  .bk-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
  .bk-when{font-size:15px;font-weight:700;color:var(--ink)}
  .bk-badge{font-size:11px;padding:2px 9px;border-radius:5px;background:var(--taupe);color:#fff;white-space:nowrap}
  .bk-name{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:3px}
  .bk-svc{font-size:12.5px;color:var(--muted);line-height:1.6}
  .bk-note{font-size:12.5px;color:#b0563f;margin-top:5px}
  .bk-tel{font-size:12.5px;color:var(--muted);margin-top:3px}
  .bk-tel a{color:var(--taupe-deep);text-decoration:none;font-weight:600}
  .bkempty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 10px}
  .tag2{font-family:"Noto Serif TC",serif;font-size:16px;font-weight:700;color:var(--ink);margin-bottom:10px}
  .batch{background:#faf5ec}
  .daystat{display:flex;gap:9px;margin:4px 0 16px}
  .dsbtn{flex:1;font:inherit;font-size:13.5px;padding:11px 6px;border:1px solid var(--line);border-radius:12px;
    background:var(--cream-soft);color:var(--muted);cursor:pointer;transition:.18s;font-weight:600}
  .dsbtn.on{background:var(--taupe);border-color:var(--taupe);color:var(--cream-soft)}
  .daytab{display:flex;gap:10px;margin:14px 0 14px}
  .rangebar{display:flex;gap:12px;margin:12px 0 4px}
  .rangebar .rb{flex:1}
  .rangebar .lbl{margin-bottom:6px}
  .dtab{flex:1;font:inherit;font-size:14px;font-weight:600;padding:12px;border:1.5px solid var(--line);
    border-radius:12px;background:var(--cream-soft);color:var(--muted);cursor:pointer;transition:.18s}
  .dtab.on{background:var(--taupe);color:var(--cream-soft);border-color:var(--taupe)}
  .bprog{text-align:center;font-size:13px;color:var(--taupe-deep);margin-top:10px;min-height:18px}
  label.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
  input[type=date]{width:100%;font:inherit;padding:14px 15px;border:1px solid var(--line);
    border-radius:14px;background:var(--cream-soft);color:var(--ink)}
  input:focus{outline:none;border-color:var(--taupe)}

  .tip{font-size:12.5px;color:var(--muted);margin:14px 0 10px}
  .holi-banner{margin-top:12px;padding:11px 14px;border-radius:12px;background:#f5e3de;border:1px solid #e3b9ae;
    color:#b0563f;font-size:13.5px;font-weight:600;text-align:center}
  .quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .qbtn{font:inherit;font-size:13px;padding:8px 14px;border:1px solid var(--line);border-radius:20px;
    background:var(--cream-soft);color:var(--taupe-deep);cursor:pointer}
  .qbtn:hover{border-color:var(--taupe)}

  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .slot{padding:13px 0;text-align:center;border:1px solid var(--line);border-radius:12px;
    background:var(--cream-soft);font-size:14px;cursor:pointer;font-family:"Noto Serif TC",serif;transition:.15s}
  .slot:hover{border-color:var(--taupe)}
  .slot.on{background:var(--taupe);color:var(--cream-soft);border-color:var(--taupe)}

  .cta{display:block;width:100%;margin-top:22px;padding:16px;border:none;border-radius:16px;
    background:var(--taupe);color:var(--cream-soft);font:inherit;font-weight:600;font-size:16px;
    letter-spacing:.15em;cursor:pointer}
  .cta:hover{background:var(--taupe-deep)}
  .cta:disabled{background:var(--sand);cursor:not-allowed}
  .msg{text-align:center;margin-top:14px;font-size:14px;min-height:22px}
  .msg.ok{color:var(--ok)} .msg.err{color:#b06a4a}
  .count{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
  footer{padding:20px 26px 36px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="moome">Moome</div>
    <div class="tag">開放時段設定</div>
    <div class="sub">這是老師專用頁面，請勿給客人</div>
  </header>

  <section class="bookings">
    <div class="tag2">📋 我的預約</div>
    <div class="bkfilter">
      <button class="bkf on" data-r="today">今天</button>
      <button class="bkf" data-r="week">未來 7 天</button>
      <button class="bkf" data-r="all">全部</button>
      <button class="bkf reload" id="bkReload">↻</button>
    </div>
    <div id="bkList" class="bklist"><div class="bkempty">讀取中…</div></div>
  </section>

  <section class="svcmgr">
    <div class="tag2">🛠 服務管理</div>
    <div class="tip">在這裡新增、編輯、刪除服務，客人的預約頁會自動更新，不用改程式。</div>
    <button class="cta" id="svcNew" style="margin-top:4px">＋ 新增服務</button>
    <div id="svcList" class="svclist"><div class="bkempty">讀取中…</div></div>
  </section>

  <!-- 編輯服務 -->
  <div class="svcmask" id="svcModal" style="display:none">
    <div class="svccard">
      <div class="svchead">編輯服務<button class="svcx" id="svcClose">✕</button></div>
      <div class="svcbody">
        <label class="lbl">名稱 <span class="req">必填</span></label>
        <input type="text" id="fName" placeholder="例如：質感霧眉" />
        <div class="frow">
          <div><label class="lbl">時長（分鐘）</label><input type="number" id="fDur" placeholder="120" /></div>
          <div><label class="lbl">價格</label><input type="number" id="fPrice" placeholder="6800" /></div>
        </div>
        <label class="lbl">原價（選填，有優惠才填）</label>
        <input type="number" id="fOrig" placeholder="8800" />

        <div class="fsec">更多設定（選填，之後再補也可以）</div>
        <label class="lbl">介紹</label>
        <textarea id="fDesc" rows="2" placeholder="一句話說明這個服務能帶來什麼"></textarea>
        <label class="lbl">服務須知</label>
        <textarea id="fNotice" rows="2" placeholder="例如：施作前請勿飲酒、需卸妝"></textarea>

        <div class="fsec">分類與標籤</div>
        <label class="lbl">分類（主目錄）</label>
        <input type="text" id="fCat" list="catList" placeholder="例如：精緻紋繡" />
        <datalist id="catList"></datalist>
        <label class="lbl">分類英文（選填）</label>
        <input type="text" id="fEn" placeholder="Brows &amp; Lips" />
        <label class="lbl">標籤（選填）</label>
        <input type="text" id="fTag" placeholder="熱門、NEW、限時優惠" />

        <div class="fsec">類型與排序</div>
        <label class="lbl">這是什麼</label>
        <div class="daystat" id="fType">
          <button class="dsbtn on" data-t="服務">主服務</button>
          <button class="dsbtn" data-t="加購">加購項目</button>
        </div>
        <div class="frow">
          <div><label class="lbl">排序（小的在前）</label><input type="number" id="fSort" placeholder="1" /></div>
          <div><label class="lbl">是否顯示</label>
            <select id="fShow"><option value="Y">顯示</option><option value="N">隱藏</option></select></div>
        </div>
      </div>
      <div class="svcfoot">
        <button class="navbtn2 del" id="svcDel">刪除</button>
        <button class="cta" id="svcSave" style="margin:0;flex:1">儲存</button>
      </div>
      <div class="msg" id="svcMsg"></div>
    </div>
  </div>

  <section class="batch">
    <div class="tag2">🚀 批次設定（一次排一段期間）</div>
    <div class="tip">選好日期範圍與「平日／假日」，點亮要開放的時段，按套用，就會一次幫你排好這段期間內所有的平日（或假日）。要提早排下個月，把開始日、結束日設成下個月即可。之後要微調某天，再用下方單日設定。</div>
    <div class="rangebar">
      <div class="rb"><label class="lbl" for="bStart">開始日</label><input type="date" id="bStart" /></div>
      <div class="rb"><label class="lbl" for="bEnd">結束日</label><input type="date" id="bEnd" /></div>
    </div>
    <div class="daytab">
      <button class="dtab on" id="tabWeekday" data-k="weekday">平日（一～五）</button>
      <button class="dtab" id="tabWeekend" data-k="weekend">假日（六、日）</button>
    </div>
    <div class="quick">
      <button class="qbtn" id="bAll">全部開放</button>
      <button class="qbtn" id="bHour">只開整點</button>
      <button class="qbtn" id="bNone">全部關閉</button>
      <button class="qbtn" id="bAM">只開上午</button>
      <button class="qbtn" id="bPM">只開下午</button>
    </div>
    <div class="slots" id="bslots"></div>
    <button class="cta" id="bapply">套用到這段期間的「平日」</button>
    <div class="msg" id="bmsg"></div>
    <div class="bprog" id="bprog"></div>
  </section>

  <section>
    <div class="tag2">🗓️ 單日設定 / 微調</div>
    <label class="lbl" for="date">選擇日期</label>
    <input type="date" id="date" />
    <div class="holi-banner" id="holiBanner" style="display:none"></div>
    <div class="tip">點亮要開放的時段，再按下方儲存。客人只會看到你開放的時段。</div>
    <label class="lbl">這天的狀態（客人月曆上會顯示）</label>
    <div class="daystat" id="dayStat">
      <button class="dsbtn on" data-s="">正常開放</button>
      <button class="dsbtn" data-s="休假">休假</button>
      <button class="dsbtn" data-s="進修">進修</button>
    </div>
    <div class="quick">
      <button class="qbtn" id="qAll">全部開放</button>
      <button class="qbtn" id="qHour">只開整點</button>
      <button class="qbtn" id="qNone">全部關閉</button>
      <button class="qbtn" id="qAM">只開上午</button>
      <button class="qbtn" id="qPM">只開下午</button>
    </div>
    <div class="slots" id="slots"></div>
    <div class="count" id="count"></div>
    <button class="cta" id="save" disabled>儲存這天的開放時段</button>
    <div class="msg" id="msg"></div>
    <button class="qbtn" id="verChk" style="display:block;margin:16px auto 0">🔍 檢查後端版本</button>
    <div class="msg" id="verMsg"></div>
  </section>

  <footer>沐蜜 Moome · 開放時段管理</footer>
</div>

<script>
/* 你的 Apps Script 網址（跟預約頁同一個）*/
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxI7vSulGL_6rvg1S_4PnGE1yfRm2bZ0ThuAONS4ydL1nWn3q5G2kWtyKL24ihiQ2XgHA/exec";

/* 時段：上午10點到晚上9點，每 2 小時一個 */
const OPEN=8, CLOSE=20, STEP=30;   // 08:00 ~ 20:00（最晚接到晚上8點）
/* 台灣國定假日（2026），選到這天會提示 */
const HOLIDAYS = {
  "2026-01-01":"元旦","2026-02-14":"小年夜","2026-02-15":"除夕",
  "2026-02-16":"春節","2026-02-17":"春節","2026-02-18":"春節",
  "2026-02-28":"和平紀念日","2026-04-04":"兒童節","2026-04-05":"清明節",
  "2026-04-06":"清明連假","2026-05-01":"勞動節","2026-06-19":"端午節",
  "2026-09-25":"中秋節","2026-10-10":"國慶日",
};
const ALL_SLOTS=[];
for(let total=OPEN*60; total<=CLOSE*60; total+=STEP){
  const h=Math.floor(total/60), m=total%60;
  ALL_SLOTS.push(`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`);
}

const $=id=>document.getElementById(id);
let selected=new Set();

const elSlots=$("slots");
ALL_SLOTS.forEach(t=>{
  const b=document.createElement("div");
  b.className="slot"; b.textContent=t; b.dataset.t=t;
  b.onclick=()=>{ if(selected.has(t))selected.delete(t); else selected.add(t);
    refresh(); };
  elSlots.appendChild(b);
});
function refresh(){
  [...elSlots.children].forEach(c=>c.classList.toggle("on", selected.has(c.dataset.t)));
  $("count").textContent = $("date").value ? `已選 ${selected.size} 個時段` : "請先選日期";
  $("save").disabled = !$("date").value;
}

/* 快速按鈕 */
$("qAll").onclick=()=>{ selected=new Set(ALL_SLOTS); refresh(); };
$("qHour").onclick=()=>{ selected=new Set(ALL_SLOTS.filter(t=>t.endsWith(":00"))); refresh(); };
$("qNone").onclick=()=>{ selected.clear(); refresh(); };
$("qAM").onclick=()=>{ selected=new Set(ALL_SLOTS.filter(t=>parseInt(t)<12)); refresh(); };
$("qPM").onclick=()=>{ selected=new Set(ALL_SLOTS.filter(t=>parseInt(t)>=12)); refresh(); };

/* ===== 服務管理 ===== */
let svcCats=[], editingId=null, fType="服務";
function jsonp(params, ok, fail){
  const cb="jp_"+Date.now()+"_"+Math.floor(Math.random()*9999);
  const t=setTimeout(()=>{ cl(); fail&&fail("timeout"); },18000);
  function cl(){ delete window[cb]; const el=document.getElementById(cb); if(el)el.remove(); clearTimeout(t); }
  window[cb]=function(res){ cl(); ok(res); };
  const sc=document.createElement("script"); sc.id=cb;
  sc.src=SCRIPT_URL+"?"+params+"&_t="+Date.now()+"&callback="+cb;
  sc.onerror=()=>{ cl(); fail&&fail("error"); };
  document.body.appendChild(sc);
}
function loadServices(){
  $("svcList").innerHTML='<div class="bkempty">讀取中…</div>';
  jsonp("action=getServices", res=>{
    if(res&&res.ok&&Array.isArray(res.categories)){ svcCats=res.categories; drawServices(); }
    else $("svcList").innerHTML='<div class="bkempty">讀取失敗，請確認後端已重新部署</div>';
  }, ()=>{ $("svcList").innerHTML='<div class="bkempty">讀取失敗，請按新增或重整再試</div>'; });
}
function drawServices(){
  if(!svcCats.length){
    $("svcList").innerHTML='<div class="bkempty">還沒有服務項目，按上面「＋ 新增服務」開始建立</div>';
    updateCatList(); return;
  }
  let html="";
  svcCats.forEach(c=>{
    html+='<div class="svcgrp">'+c.title+(c.en?'｜'+c.en:'')+'</div>';
    c.items.concat(c.addons.map(a=>Object.assign({},a,{_add:true}))).forEach(it=>{
      const dur = it.dur? Math.floor(it.dur/60)+" 時"+(it.dur%60?" "+(it.dur%60)+" 分":"") : "";
      html+='<div class="svcrow" data-id="'+it.key+'" data-cat="'+c.title+'" data-en="'+(c.en||"")+'" data-add="'+(it._add?1:0)+'">'
        +'<div class="sr-l"><div class="sr-n">'+it.name
        +(it.tag?'<span class="sr-tag">'+it.tag+'</span>':'')
        +(it._add?'<span class="sr-add">加購</span>':'')+'</div>'
        +'<div class="sr-m">'+[dur,it.desc].filter(Boolean).join(" ・ ")+'</div></div>'
        +'<div class="sr-p">$'+(it.price||0).toLocaleString()+'</div></div>';
    });
  });
  $("svcList").innerHTML=html;
  document.querySelectorAll(".svcrow").forEach(r=>{
    r.onclick=()=>{
      const id=r.getAttribute("data-id");
      let found=null, fc=null, isAdd=r.getAttribute("data-add")==="1";
      svcCats.forEach(c=>{ (isAdd?c.addons:c.items).forEach(x=>{ if(x.key===id){found=x;fc=c;} }); });
      if(found) openSvcModal(found, fc, isAdd);
    };
  });
  updateCatList();
}
function updateCatList(){
  $("catList").innerHTML = svcCats.map(c=>'<option value="'+c.title+'">').join("");
}
function setType(t){
  fType=t;
  document.querySelectorAll("#fType .dsbtn").forEach(b=>b.classList.toggle("on", b.getAttribute("data-t")===t));
}
document.querySelectorAll("#fType .dsbtn").forEach(b=>{ b.onclick=()=>setType(b.getAttribute("data-t")); });

function openSvcModal(it, cat, isAdd){
  editingId = it ? it.key : null;
  $("fName").value = it?it.name:"";
  $("fDur").value  = it&&it.dur?it.dur:"";
  $("fPrice").value= it&&it.price?it.price:"";
  $("fOrig").value = it&&it.orig?it.orig:"";
  $("fDesc").value = it?(it.desc||""):"";
  $("fNotice").value=it?(it.notice||""):"";
  $("fCat").value  = cat?cat.title:"";
  $("fEn").value   = cat?(cat.en||""):"";
  $("fTag").value  = it?(it.tag||""):"";
  $("fSort").value = it&&it.sort?it.sort:"";
  $("fShow").value = "Y";
  setType(isAdd?"加購":"服務");
  $("svcDel").style.display = it ? "block" : "none";
  $("svcMsg").textContent="";
  $("svcModal").style.display="flex";
}
$("svcNew").onclick=()=>openSvcModal(null,null,false);
$("svcClose").onclick=()=>{ $("svcModal").style.display="none"; };

$("svcSave").onclick=()=>{
  const name=$("fName").value.trim();
  if(!name){ $("svcMsg").className="msg err"; $("svcMsg").textContent="請填寫名稱"; return; }
  if(!$("fCat").value.trim()){ $("svcMsg").className="msg err"; $("svcMsg").textContent="請填寫分類"; return; }
  $("svcMsg").className="msg"; $("svcMsg").textContent="儲存中…";
  const p="action=svcSave"
    +"&id="+encodeURIComponent(editingId||"")
    +"&cat="+encodeURIComponent($("fCat").value.trim())
    +"&en="+encodeURIComponent($("fEn").value.trim())
    +"&type="+encodeURIComponent(fType)
    +"&name="+encodeURIComponent(name)
    +"&dur="+encodeURIComponent($("fDur").value||0)
    +"&price="+encodeURIComponent($("fPrice").value||0)
    +"&orig="+encodeURIComponent($("fOrig").value||0)
    +"&desc="+encodeURIComponent($("fDesc").value.trim())
    +"&notice="+encodeURIComponent($("fNotice").value.trim())
    +"&tag="+encodeURIComponent($("fTag").value.trim())
    +"&sort="+encodeURIComponent($("fSort").value||0)
    +"&show="+encodeURIComponent($("fShow").value);
  jsonp(p, res=>{
    if(res&&res.ok){ $("svcModal").style.display="none"; loadServices(); }
    else { $("svcMsg").className="msg err"; $("svcMsg").textContent="儲存失敗，請確認後端已重新部署"; }
  }, ()=>{ $("svcMsg").className="msg err"; $("svcMsg").textContent="連線逾時，請再試一次"; });
};

$("svcDel").onclick=()=>{
  if(!editingId)return;
  if(!confirm("確定要刪除這個服務嗎？刪除後客人就看不到了。"))return;
  $("svcMsg").className="msg"; $("svcMsg").textContent="刪除中…";
  jsonp("action=svcDelete&id="+encodeURIComponent(editingId), res=>{
    if(res&&res.ok){ $("svcModal").style.display="none"; loadServices(); }
    else { $("svcMsg").className="msg err"; $("svcMsg").textContent="刪除失敗"; }
  }, ()=>{ $("svcMsg").className="msg err"; $("svcMsg").textContent="連線逾時"; });
};
loadServices();

/* ===== 預約一覽表 ===== */
let bkData = null, bkRange = "today";
function ymdLocal(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function loadBookings(){
  $("bkList").innerHTML='<div class="bkempty">讀取中…</div>';
  const cb="bkCB_"+Date.now();
  const t=setTimeout(()=>{ cleanupB(); $("bkList").innerHTML='<div class="bkempty">讀取失敗，請按 ↻ 再試一次</div>'; },18000);
  function cleanupB(){ delete window[cb]; const el=document.getElementById(cb); if(el)el.remove(); clearTimeout(t); }
  window[cb]=function(res){ cleanupB();
    if(res && res.ok && Array.isArray(res.bookings)){ bkData=res.bookings; drawBookings(); }
    else { $("bkList").innerHTML='<div class="bkempty">讀取失敗，請確認後端是否已重新部署</div>'; }
  };
  const sc=document.createElement("script"); sc.id=cb;
  sc.src=SCRIPT_URL+"?action=getBookings&days=120&_t="+Date.now()+"&callback="+cb;
  sc.onerror=()=>{ cleanupB(); $("bkList").innerHTML='<div class="bkempty">連線失敗，請檢查網路</div>'; };
  document.body.appendChild(sc);
}
function drawBookings(){
  if(!bkData){ return; }
  const today=ymdLocal(new Date());
  const d7=new Date(); d7.setDate(d7.getDate()+7);
  const to7=ymdLocal(d7);
  let list=bkData;
  if(bkRange==="today") list=bkData.filter(b=>b.date===today);
  else if(bkRange==="week") list=bkData.filter(b=>b.date>=today && b.date<=to7);
  if(!list.length){
    $("bkList").innerHTML='<div class="bkempty">'+(bkRange==="today"?"今天沒有預約 ☕":"這段期間沒有預約")+'</div>';
    return;
  }
  const wd=["日","一","二","三","四","五","六"];
  $("bkList").innerHTML = list.map(b=>{
    const w=wd[new Date(b.date+"T00:00:00").getDay()];
    const isToday = b.date===today;
    return `<div class="bkcard${isToday?" today":""}">
      <div class="bk-top">
        <span class="bk-when">${b.date.substring(5)}（${w}）${b.time}</span>
        ${isToday?'<span class="bk-badge">今天</span>':''}
      </div>
      <div class="bk-name">${b.name||"（未填姓名）"}</div>
      <div class="bk-svc">${b.service||""}</div>
      ${b.phone?`<div class="bk-tel">📞 <a href="tel:${b.phone}">${b.phone}</a></div>`:""}
      ${b.note?`<div class="bk-note">📝 ${b.note}</div>`:""}
    </div>`;
  }).join("");
}
[].forEach.call(document.querySelectorAll(".bkf[data-r]"), function(b){
  b.onclick=function(){
    document.querySelectorAll(".bkf[data-r]").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); bkRange=b.getAttribute("data-r"); drawBookings();
  };
});
$("bkReload").onclick=loadBookings;
loadBookings();

/* 檢查後端是否已更新（部署成功與否） */
$("verChk").onclick=()=>{
  $("verMsg").className="msg"; $("verMsg").textContent="檢查中…";
  const cb="verCB_"+Date.now();
  const t=setTimeout(()=>{ cleanupV(); $("verMsg").className="msg err"; $("verMsg").textContent="檢查逾時，請確認網路。"; },10000);
  function cleanupV(){ delete window[cb]; const el=document.getElementById(cb); if(el)el.remove(); clearTimeout(t); }
  window[cb]=function(res){ cleanupV();
    if(res && res.version==="v7-services"){
      $("verMsg").className="msg ok"; $("verMsg").textContent="✓ 後端已是最新版（休假／進修功能可用）";
    }else{
      $("verMsg").className="msg err";
      $("verMsg").textContent="✗ 後端仍是舊版 → 請到 Apps Script：部署 → 管理部署作業 → 鉛筆 → 版本選「新版本」→ 部署";
    }
  };
  const sc=document.createElement("script"); sc.id=cb;
  sc.src=SCRIPT_URL+"?action=version&callback="+cb;
  sc.onerror=()=>{ cleanupV(); $("verMsg").className="msg err"; $("verMsg").textContent="連線失敗。"; };
  document.body.appendChild(sc);
};

/* 這天的狀態（休假／進修） */
let dayStatus = "";
[].forEach.call(document.querySelectorAll("#dayStat .dsbtn"), function(b){
  b.onclick=function(){
    document.querySelectorAll("#dayStat .dsbtn").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    dayStatus = b.getAttribute("data-s") || "";
    if(dayStatus){ selected.clear(); refresh(); }   // 休假／進修 → 不開放任何時段
  };
});
function setStatusUI(v){
  dayStatus = v || "";
  document.querySelectorAll("#dayStat .dsbtn").forEach(x=>{
    x.classList.toggle("on", (x.getAttribute("data-s")||"") === dayStatus);
  });
}

/* 選日期 → 讀這天已設定的時段帶入 */
const elDate=$("date");
const today=new Date(); today.setHours(0,0,0,0);
elDate.min=today.toISOString().split("T")[0];
elDate.onchange=()=>{
  $("msg").textContent=""; selected.clear(); setStatusUI(""); refresh();
  if(!elDate.value)return;
  // 假日提示
  const holi=HOLIDAYS[elDate.value];
  const wd=["日","一","二","三","四","五","六"][new Date(elDate.value+"T00:00:00").getDay()];
  const banner=$("holiBanner");
  if(holi){ banner.style.display="block"; banner.textContent="🎌 "+elDate.value+"（週"+wd+"）是 "+holi+" — 國定假日"; }
  else { banner.style.display="none"; }
  $("count").textContent="讀取中…";
  const cb="adminCB_"+Date.now();
  const timer=setTimeout(()=>{ cleanup(); refresh(); },6000);
  function cleanup(){ delete window[cb]; const s=$(cb); if(s)s.remove(); clearTimeout(timer); }
  window[cb]=function(res){ cleanup();
    if(res&&res.slots){
      // 只接受合格時段，過濾掉試算表格式亂掉產生的垃圾
      res.slots.filter(t=>/^\d{2}:\d{2}$/.test(t) && ALL_SLOTS.indexOf(t)>=0)
               .forEach(t=>selected.add(t));
    }
    setStatusUI(res && res.status);
    refresh();
  };
  const s=document.createElement("script"); s.id=cb;
  s.src=SCRIPT_URL+"?action=getSlots&date="+encodeURIComponent(elDate.value)+"&callback="+cb;
  s.onerror=()=>{ cleanup(); refresh(); };
  document.body.appendChild(s);
};

/* 儲存 */
$("save").onclick=()=>{
  const btn=$("save"); btn.disabled=true; btn.textContent="儲存中…";
  $("msg").textContent=""; $("msg").className="msg";
  const slots=[...selected].filter(t=>ALL_SLOTS.indexOf(t)>=0).sort();
  const cb="saveCB_"+Date.now();
  const timer=setTimeout(()=>{ cleanup();
    $("msg").className="msg err"; $("msg").textContent="儲存逾時，請檢查網路後再試一次。";
    btn.disabled=false; btn.textContent="儲存這天的開放時段"; },12000);
  function cleanup(){ delete window[cb]; const el=document.getElementById(cb); if(el)el.remove(); clearTimeout(timer); }
  window[cb]=function(res){ cleanup();
    btn.disabled=false; btn.textContent="儲存這天的開放時段";
    if(res && res.ok){
      // 用後端回報的內容更新畫面，確保看到的就是真正存進去的
      selected=new Set((res.saved||[]).filter(t=>ALL_SLOTS.indexOf(t)>=0)); refresh();
      $("msg").className="msg ok";
      $("msg").textContent = dayStatus
        ? "✓ 已儲存：這天標示為「"+dayStatus+"」，客人月曆會顯示"
        : ((res.saved&&res.saved.length)
            ? "✓ 已儲存："+res.saved.join("、")
            : "✓ 已儲存：這天全部關閉（客人看不到任何時段）");
    }else{
      // 後端還是舊版（沒重新部署）→ 自動改用舊方式存檔
      const why = (res && res.error) ? ("（後端訊息："+res.error+"）") : "（後端沒有回應此功能，多半是 Apps Script 還沒重新部署）";
      fetch(SCRIPT_URL,{ method:"POST", mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({ action:"saveSlots", date:elDate.value, slots:slots, status:dayStatus })
      }).then(()=>{
        $("msg").className="msg ok";
        $("msg").textContent="已用備援方式送出儲存，請重選一次日期確認是否正確。"+why;
      }).catch(()=>{
        $("msg").className="msg err";
        $("msg").textContent="儲存失敗 "+why;
      });
    }
  };
  const sc=document.createElement("script"); sc.id=cb;
  sc.src=SCRIPT_URL+"?action=saveSlots&date="+encodeURIComponent(elDate.value)
       +"&slots="+encodeURIComponent(slots.join(","))
       +"&status="+encodeURIComponent(dayStatus)+"&callback="+cb;
  sc.onerror=()=>{ cleanup(); $("msg").className="msg err"; $("msg").textContent="連線失敗，請檢查網路。";
    btn.disabled=false; btn.textContent="儲存這天的開放時段"; };
  document.body.appendChild(sc);
};

/* ===== 批次設定：平日/假日預設時段，一次套用未來 4 週 ===== */
let bSelected = new Set(ALL_SLOTS);   // 批次目前選的時段
let bMode = "weekday";                 // weekday 或 weekend

const bslots = $("bslots");
ALL_SLOTS.forEach(t=>{
  const el=document.createElement("div"); el.className="slot on"; el.textContent=t;
  el.onclick=()=>{ if(bSelected.has(t))bSelected.delete(t); else bSelected.add(t); bRefresh(); };
  bslots.appendChild(el);
});
function bRefresh(){
  [...bslots.children].forEach(el=>{
    if(bSelected.has(el.textContent)) el.classList.add("on"); else el.classList.remove("on");
  });
}
bRefresh();

$("bAll").onclick=()=>{ bSelected=new Set(ALL_SLOTS); bRefresh(); };
$("bHour").onclick=()=>{ bSelected=new Set(ALL_SLOTS.filter(t=>t.endsWith(":00"))); bRefresh(); };
$("bNone").onclick=()=>{ bSelected.clear(); bRefresh(); };
$("bAM").onclick=()=>{ bSelected=new Set(ALL_SLOTS.filter(t=>parseInt(t)<12)); bRefresh(); };
$("bPM").onclick=()=>{ bSelected=new Set(ALL_SLOTS.filter(t=>parseInt(t)>=12)); bRefresh(); };

function switchTab(k){
  bMode=k;
  $("tabWeekday").classList.toggle("on", k==="weekday");
  $("tabWeekend").classList.toggle("on", k==="weekend");
  $("bapply").textContent = k==="weekday" ? "套用到這段期間的「平日」" : "套用到這段期間的「假日」";
}
$("tabWeekday").onclick=()=>switchTab("weekday");
$("tabWeekend").onclick=()=>switchTab("weekend");

function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

$("bapply").onclick=async ()=>{
  const startV=$("bStart").value, endV=$("bEnd").value;
  if(!startV || !endV){ $("bmsg").className="msg err"; $("bmsg").textContent="請先選開始日和結束日。"; return; }
  const start=new Date(startV+"T00:00:00"), end=new Date(endV+"T00:00:00");
  if(end<start){ $("bmsg").className="msg err"; $("bmsg").textContent="結束日不能早於開始日喔。"; return; }
  const slots=[...bSelected].filter(t=>ALL_SLOTS.indexOf(t)>=0).sort();
  // 找出範圍內符合平日/假日的日期
  const dates=[];
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const wd=d.getDay(); // 0日 6六
    const isWeekend = (wd===0 || wd===6);
    if(bMode==="weekday" && !isWeekend) dates.push(ymd(d));
    if(bMode==="weekend" && isWeekend) dates.push(ymd(d));
  }
  if(dates.length===0){ $("bmsg").className="msg err"; $("bmsg").textContent="這段期間內沒有符合的日子，換個範圍或切換平日/假日試試。"; return; }
  if(dates.length>80){ $("bmsg").className="msg err"; $("bmsg").textContent="一次最多排 80 天，請縮短範圍。"; return; }
  const btn=$("bapply"); btn.disabled=true;
  $("bmsg").textContent=""; $("bprog").textContent="";
  const label = bMode==="weekday"?"平日":"假日";
  for(let i=0;i<dates.length;i++){
    $("bprog").textContent = `套用中… ${i+1}/${dates.length}（${dates[i]}）`;
    try{
      await fetch(SCRIPT_URL,{ method:"POST", mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({ action:"saveSlots", date:dates[i], slots:slots }) });
    }catch(e){}
    await new Promise(r=>setTimeout(r,350));
  }
  $("bprog").textContent="";
  $("bmsg").className="msg ok";
  $("bmsg").textContent = `✓ 已套用！這段期間共 ${dates.length} 個${label}都設好了。要單獨改某天，用下方單日設定即可。`;
  btn.disabled=false;
};

/* 預設把開始日填今天、結束日填 4 週後，方便直接用 */
(function(){
  const t=new Date(); const e=new Date(); e.setDate(e.getDate()+28);
  $("bStart").value=ymd(t); $("bEnd").value=ymd(e);
})();
</script>
